[project]
name = "lajur"
version = "0.1.0"
description = "A public drive-thru voice ordering demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "pyright>=1.1"
]

[tool.uv.workspace]
members = ["packages/cart", "services/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = ["packages/cart/src", "services/agent/src", "."]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages/cart/tests", "services/agent/tests", "eval/tests"]
pythonpath = ["packages/cart/src", "services/agent/src", "."]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main\\(\\):",
]
