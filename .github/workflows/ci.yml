name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  repo-guard-and-eval-validation:
    name: Repository Guards & Menu/Scenario Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security Guard - Check for tracked private/ files
        run: |
          TRACKED_PRIVATE=$(git ls-files private/)
          if [ -n "$TRACKED_PRIVATE" ]; then
            echo "ERROR: Confidential files detected in git tracking under private/:"
            echo "$TRACKED_PRIVATE"
            exit 1
          fi
          echo "Guard passed: No private/ files are tracked."

      - name: Security Guard - Ensure no .env secret file tracked
        run: |
          TRACKED_ENV=$(git ls-files .env .env.local .env.production)
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: .env secret file detected in git tracking!"
            exit 1
          fi
          echo "Guard passed: No secret .env files tracked."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Menu JSON integrity
        run: |
          python eval/menu/validate_menu.py

      - name: Validate Scenarios against Menu
        run: |
          python eval/scripts/validate_scenarios.py

  cart-and-python-workspace:
    name: Python Lint, Typecheck & Unit Tests (Cart & Agent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: Ruff Lint Check
        run: |
          uv run ruff check .

      - name: Pyright Type Check (Cart & Agent)
        run: |
          uv run pyright packages/cart services/agent

      - name: Pytest Unit Tests (Cart & Agent)
        run: |
          uv run pytest -v

  web-application:
    name: Web App Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: |
          npm run typecheck

      - name: ESLint Check
        working-directory: apps/web
        run: |
          npm run lint

      - name: Next.js Production Build
        working-directory: apps/web
        env:
          LIVEKIT_URL: "wss://placeholder.livekit.cloud"
          LIVEKIT_API_KEY: "devkey"
          LIVEKIT_API_SECRET: "secretsecretsecretsecretsecretsecret32"
          NEXT_PUBLIC_LIVEKIT_URL: "wss://placeholder.livekit.cloud"
        run: |
          npm run build

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium

      - name: Playwright E2E & A11y Tests
        working-directory: apps/web
        env:
          LIVEKIT_URL: "wss://placeholder.livekit.cloud"
          LIVEKIT_API_KEY: "devkey"
          LIVEKIT_API_SECRET: "secretsecretsecretsecretsecretsecret32"
          NEXT_PUBLIC_LIVEKIT_URL: "wss://placeholder.livekit.cloud"
        run: |
          npm run test:e2e
