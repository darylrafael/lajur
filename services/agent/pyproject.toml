[project]
name = "lajur-agent"
version = "0.1.0"
description = "LiveKit agent worker for Lajur voice ordering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.8.8",
    "livekit-api>=1.2.1",
    "python-dotenv>=1.0.0",
    "lajur-cart"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
lajur-cart = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lajur_agent"]
